name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.30.0
          sha256: cad88bfdd768271efd31e4a8b84f5e8b0c7a232edae27b494e6d518cbc401e38 # linux-x86_64

      # The WebSocket client of the specs (package websocket-client, in its own manifest under specs/fixtures/ws_client).
      - name: Install the dependencies of the specs
        run: make install

      - name: Check
        run: |
          agentica --version
          agentica check

      - name: Format
        run: make fmt-check

      # The features of specs/ (they listen on 127.0.0.1 only) and the unit tests of test/.
      - name: Test
        run: make test

      # Every agentica block of the site must check, and run when an output block follows it.
      - name: Site samples
        run: make site-samples

      # The assembly of the multi-version site (tools/site_versions.py) on a small git repository.
      - name: Site versions
        run: make site-versions-test
