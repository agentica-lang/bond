name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.31.0
          sha256: 1f72c23972c1e5a6c04af2d289f947f5cf96116bea01543ac61208c0136fad7e # linux-x86_64

      # The WebSocket client of the specs (package websocket-client, with a manifest of its own in specs/fixtures/ws_client).
      - name: Install the dependencies of the specs
        run: make install

      - name: Check
        run: |
          agentica --version
          agentica check

      - name: Format
        run: make fmt-check

      # The features of specs/ (they listen on 127.0.0.1 only) and the unit tests of test/.
      - name: Test
        run: make test

      # Every agentica block of the site must check, and run when an output block follows it.
      - name: Site samples
        run: make site-samples

      # The assembly of the multi-version site (tools/site_versions.py) on a small git repository.
      - name: Site versions
        run: make site-versions-test
