name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.25.0
  AGENTICA_SHA256: 4ecf226a4a8c1ac2573bfe23674c387a40b0cc69f97ecbf408d9a7888ec9da3d

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check
        run: |
          agentica --version
          agentica check

      - name: Format
        run: make fmt-check

      # The features of specs/ (they listen on 127.0.0.1 only) and the unit tests of test/.
      - name: Test
        run: make test

      # Every agentica block of the site must check, and run when an output block follows it.
      - name: Site samples
        run: make site-samples

      # The assembly of the multi-version site (tools/site_versions.py) on a small git repository.
      - name: Site versions
        run: make site-versions-test
