baseURL = "https://agentica-lang.github.io/bond/"
locale = "en"
title = "Bond"
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Bond is a small web framework for Agentica, in the spirit of Sinatra: routes, filters, custom error pages and a test helper that needs no socket."
  repo = "https://github.com/agentica-lang/bond"
  narrow = "50rem"

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[minify]
  minifyOutput = true

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "assets"
  target = "assets"

[outputs]
  home = ["html", "markdown", "search"]
  section = ["html", "markdown"]
  page = ["html", "markdown"]
